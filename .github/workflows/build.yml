name: Build and release MarbleOS

# Every build of MarbleOS ships everywhere at once:
#   web      the game checked on phone, tablet, PC and Mac screens; on main, published to GitHub Pages
#   android  the Android app (.apk), signed with the family key from GitHub secrets
#   windows  the Windows installer (.exe) and .msi, made with Tauri
#   mac      the Mac app (.dmg, Apple silicon and Intel), made with Tauri
#   release  on main, a GitHub Release with all of them, the update file and the source code
# Pull requests run the same builds as a check, without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One number for every platform, so a new version installs over the old one everywhere.
  MOS_VERSION: 1.0.${{ github.run_number }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  web:
    name: Web (every screen size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check phones, tablets, PCs and Macs
        run: |
          npx playwright install --with-deps chromium
          npm run check:screens
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/
          if-no-files-found: ignore
      - name: Publish to gh-pages
        if: env.PUBLISH == 'true'
        run: |
          cp -r android/app/src/main/assets site
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "MarbleOS ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:gh-pages

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # The family key lives only in GitHub secrets. Pull requests build with the debug key and are never published.
      - name: Restore the family key
        env:
          KEYSTORE_B64: ${{ secrets.MARBLEOS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/marbleos.jks
          elif [ "$PUBLISH" = "true" ]; then
            # No secret yet: use the same family key from the first commit's history (never re-added to the tree),
            # so phones keep updating. Adding the MARBLEOS_KEYSTORE_B64 secret later takes over automatically.
            echo "::notice::MARBLEOS_KEYSTORE_B64 is not set; using the family key from the repository history."
            git fetch -q --depth=1 origin f481df168fe6bbf2886592df20031e6e0dbfe33d
            git show f481df168fe6bbf2886592df20031e6e0dbfe33d:android/app/marbleos.jks > android/app/marbleos.jks
          else
            echo "::notice::No family key on this build: the APK is signed with the debug key and is not published."
          fi
      - name: Build the APK
        working-directory: android
        env:
          MARBLEOS_KEYSTORE_PASSWORD: ${{ secrets.MARBLEOS_KEYSTORE_PASSWORD || 'marbleos2026' }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: mkdir out && cp android/app/build/outputs/apk/release/app-release.apk out/MarbleOS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm version "$env:MOS_VERSION" --no-git-tag-version --allow-same-version
      - name: Build the installers
        shell: bash
        env:
          # Signs the update so installed apps trust it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PUBLIC_KEY" ]; then
            npx tauri build --ci --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$TAURI_SIGNING_PUBLIC_KEY\"}}}"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this build cannot update installed apps."
            npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Name the installers
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/MarbleOS-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/MarbleOS.msi
          if ls src-tauri/target/release/bundle/nsis/*-setup.exe.sig >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/MarbleOS-Setup.exe.sig
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm version "$MOS_VERSION" --no-git-tag-version --allow-same-version
      - name: Build the Mac app (Apple silicon and Intel)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_SIGNING_PUBLIC_KEY" ]; then
            npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$TAURI_SIGNING_PUBLIC_KEY\"}}}"
          else
            npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          B=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir out
          cp "$B"/dmg/*.dmg out/MarbleOS.dmg
          if ls "$B"/macos/*.app.tar.gz.sig >/dev/null 2>&1; then
            cp "$B"/macos/*.app.tar.gz out/MarbleOS-mac.app.tar.gz
            cp "$B"/macos/*.app.tar.gz.sig out/MarbleOS-mac.app.tar.gz.sig
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  release:
    name: Publish (main only)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web, android, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{android,windows,mac}'
          path: out
          merge-multiple: true
      - name: Write latest.json for the Windows and Mac updater
        run: |
          if [ -f out/MarbleOS-Setup.exe.sig ]; then
            BASE="https://github.com/${{ github.repository }}/releases/download/v$MOS_VERSION"
            jq -n --arg v "$MOS_VERSION" --arg sig "$(cat out/MarbleOS-Setup.exe.sig)" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg url "$BASE/MarbleOS-Setup.exe" \
              '{version: $v, notes: "MarbleOS \($v)", pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > out/latest.json
            if [ -f out/MarbleOS-mac.app.tar.gz.sig ]; then
              jq --arg sig "$(cat out/MarbleOS-mac.app.tar.gz.sig)" --arg url "$BASE/MarbleOS-mac.app.tar.gz" \
                '.platforms["darwin-aarch64"] = {signature: $sig, url: $url} | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' out/latest.json > out/l.json && mv out/l.json out/latest.json
            fi
            cat out/latest.json
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOS_VERSION }}
          target_commitish: ${{ github.sha }}
          name: MarbleOS ${{ env.MOS_VERSION }}
          make_latest: true
          body: |
            **MarbleOS** — a 3D marble shooter by Martin B. Works offline, French and English.

            - **Play on the web**: https://fisbal.github.io/MarbleOS/
            - **Android**: MarbleOS.apk (tap it, open the file, Install). Newer versions install over the old one and keep your progress.
            - **Windows**: MarbleOS-Setup.exe (or MarbleOS.msi)
            - **Mac** (Apple silicon and Intel): MarbleOS.dmg. The first time: right-click MarbleOS, then Open.
            - Installed apps update themselves: Windows and Mac install the new version and reopen, Android offers it.
            - Source code: the zip and tar.gz below
          files: |
            out/MarbleOS*
            out/latest.json
