name: Build MarbleOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MarbleOS.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarbleOS-apk
          path: MarbleOS.apk

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MarbleOS 1.0.${{ github.run_number }}
          make_latest: true
          files: MarbleOS.apk
          body: |
            **MarbleOS** — a 3D marble shooter by Martin B. Works offline, French and English.

            **Install on an Android phone**
            1. Tap **MarbleOS.apk** below to download it.
            2. Open the downloaded file. If Android asks, allow your browser to *install unknown apps*.
            3. Tap **Install**, then **Open**.

            Newer versions install over the old one and keep your progress.
