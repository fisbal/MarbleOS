<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>MarbleOS Temple</title>

<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cinzel-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/cinzel-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: one full-height column — header bar (level, stars, score, lives), the 3D board in the middle, a control bar at the bottom. Nothing floats over the marbles. Single dark theme by choice; --accent follows the world. */
:root{
  --gold:#d4ad62; --gold-dim:#7d6534; --accent:#d4ad62; --ink:#efeae0; --muted:#9aa096;
  --display:"Cinzel", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{background:#000;color:var(--ink);height:100%;overflow:hidden}
body{font-family:var(--body);padding:0;margin:0}
[hidden]{display:none!important}
.stage{position:relative;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*.6))}
@supports not (height:100dvh){.stage{height:100vh;width:min(100vw,60vh)}}
header.top{flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#16130f,#0b0a08);border-bottom:1px solid #30281a;box-shadow:0 2px 12px #000;z-index:2}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1;margin:0}
.brand b{color:var(--gold)}
.brand small{display:block;font-family:var(--body);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.mid{display:flex;flex-direction:column;gap:5px;min-width:0}
.mid .row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mid .row b{font-family:var(--display);color:var(--ink);font-size:.95rem;letter-spacing:0;margin-left:3px}
.stars{font-size:.85rem;letter-spacing:1px;color:#3c3528}
.stars .on{color:var(--gold);text-shadow:0 0 6px rgba(212,173,98,.6)}
.bar{height:5px;border-radius:99px;background:#26211a;overflow:hidden;box-shadow:inset 0 1px 2px #000}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--accent));transition:width .3s}
.right{text-align:right;line-height:1.05}
.right strong{font-family:var(--display);font-size:1.08rem;color:var(--gold);font-variant-numeric:tabular-nums;display:block}
.right small{font-size:.52rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.right small b{color:var(--ink);font-variant-numeric:tabular-nums}
.hearts{color:#e8485e;font-size:.72rem;letter-spacing:1px;display:block;margin-top:3px}
.pf{position:relative;flex:1 1 auto;min-height:0;touch-action:none;background:#000}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{cursor:crosshair}
#hud,#flash{pointer-events:none}
#flash{position:absolute;inset:0;opacity:0;background:#fff}
footer.bot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(0deg,#16130f,#0b0a08);border-top:1px solid #30281a;z-index:2}
.grp{display:flex;gap:7px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid rgba(212,173,98,.45);background:#17140f;color:var(--ink);font-size:16px;line-height:1;cursor:pointer;
  display:grid;place-items:center;font-family:var(--body);font-weight:800;padding:0}
.ic.big{width:58px;height:58px;font-size:24px;border-color:var(--gold);background:radial-gradient(circle at 35% 30%,#3d321c,#120f0a);box-shadow:0 0 16px rgba(212,173,98,.25)}
.ic.txt{font-size:.66rem;letter-spacing:.06em}
.ic[aria-pressed="false"]{opacity:.4}
.ic:focus-visible,.btn:focus-visible,.play:focus-visible,.tile:focus-visible,.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.overlay{position:absolute;inset:0;z-index:5;display:flex;overflow-y:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 35%,rgba(12,11,9,.66),rgba(3,3,3,.93))}
.ovin{margin:auto;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-family:var(--display);font-weight:800;font-size:2.7rem;margin:0;line-height:1;text-shadow:0 2px 24px #000}
.logo b{color:var(--gold)}
.ovin h2{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;line-height:1.1;text-wrap:balance;text-shadow:0 2px 18px #000}
.ovin h2 b{color:var(--gold)}
.ovin h2 span{display:block;font-size:.48em;letter-spacing:.2em;color:var(--accent);margin-top:8px;text-transform:uppercase}
.ovin p{margin:0;color:#c3c7bf;line-height:1.55;max-width:32ch;font-size:.9rem}
.ovin .big{font-family:var(--display);font-size:1.15rem;color:var(--gold)}
.ovin .tip{font-size:.72rem;color:#8f968d}
.play{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.12em;padding:14px 30px;border-radius:14px;border:0;cursor:pointer;
  color:#1b1406;background:linear-gradient(180deg,#ecd394,var(--gold) 55%,#9c7a32);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold-dim),0 0 30px rgba(212,173,98,.33)}
.play:hover{filter:brightness(1.08)}
.btn{font-family:var(--body);font-weight:800;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;padding:11px 24px;border-radius:999px;border:1px solid var(--gold-dim);background:rgba(20,18,14,.85);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.langs{display:inline-flex;border:1px solid #3a3226;border-radius:999px;padding:3px;background:#0e0d0b}
.langs button{border:0;background:transparent;color:var(--muted);font:800 .7rem/1 var(--body);letter-spacing:.12em;padding:8px 14px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#2b2418;color:var(--gold)}
.legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;text-align:left;font-size:.68rem;color:var(--muted);border-top:1px solid #2a2418;padding-top:12px}
.legend h3{grid-column:1/-1;margin:0;font:800 .6rem/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.legend div{display:flex;gap:8px;align-items:center;line-height:1.3;min-width:0}
.legend img{width:26px;height:26px;flex:0 0 26px}
.legend b{color:var(--ink);display:block;font-size:.72rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.tile{position:relative;aspect-ratio:1/1.1;border-radius:12px;border:1px solid rgba(212,173,98,.35);background:linear-gradient(160deg,var(--c) 0%,#0b0a08 78%);color:var(--ink);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;font-family:var(--body)}
.tile b{font-family:var(--display);font-size:1.3rem;text-shadow:0 1px 6px #000}
.tile small{font-size:.5rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#ece6d8;opacity:.9}
.tile i{font-style:normal;color:var(--gold);font-size:.62rem;letter-spacing:1px}
.tile.lock{opacity:.35;cursor:not-allowed}
.tile.cur{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(212,173,98,.45)}
.bigstars{font-size:2.6rem;letter-spacing:8px;color:#3a3426;line-height:1}
.bigstars .on{color:var(--gold);text-shadow:0 0 18px rgba(212,173,98,.7)}
.cred{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:#6a7266}
.cred b{color:var(--gold-dim)}
.err{color:#ff9aa8}
.ic{position:relative}
.ic img{width:27px;height:27px;pointer-events:none;display:block}
.ic .n{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1b1406;font:800 .62rem/18px var(--body);padding:0 4px;text-align:center;box-shadow:0 0 0 2px #0b0a08}
.ic.empty img{opacity:.35;filter:grayscale(1)}
.ic.empty .n{background:#3a3226;color:var(--muted)}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#e8b838 55%,#8a6410);box-shadow:inset 0 0 0 1px #6a4a10;vertical-align:-.12em;margin-right:4px}
.cw{color:var(--gold);font-size:.66rem;font-weight:800;margin-left:6px;font-variant-numeric:tabular-nums}
.wallet{font-family:var(--display);font-size:1.5rem!important;color:var(--gold)!important;font-variant-numeric:tabular-nums}
.shop{display:grid;gap:8px;width:100%}
.shop h3{margin:6px 0 0;font:800 .6rem/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;background:rgba(22,19,14,.9);border:1px solid #2f2819}
.item img,.item .sw{width:40px;height:40px;border-radius:50%;display:block}
.item .sw{box-shadow:inset -4px -6px 10px rgba(0,0,0,.45),inset 3px 4px 8px rgba(255,255,255,.35)}
.item b{display:block;font-size:.84rem;color:var(--ink)}
.item small{display:block;font-size:.68rem;color:var(--muted);line-height:1.35}
.item .own{color:var(--accent);font-weight:800;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:13px;height:4px;border-radius:2px;background:#3a3226}
.pips i.on{background:var(--gold)}
.buy{font:800 .74rem/1 var(--body);padding:9px 12px;border-radius:999px;border:1px solid var(--gold);background:linear-gradient(180deg,#3d321c,#1a150c);color:var(--gold);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:hover{filter:brightness(1.15)}
.buy:disabled{opacity:.4;cursor:not-allowed;border-color:#3a3226;color:var(--muted)}
.buy.tag{border-color:#3a3226;color:var(--muted);background:none;cursor:default}
.buy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gotlist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gotlist div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--ink);font-weight:800}
.gotlist img{width:46px;height:46px}
.gift{background:linear-gradient(180deg,#3a2c10,#1a140a)!important;border-color:var(--gold)!important;color:var(--gold)!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <h1 class="brand">Marble<b>OS</b><small id="worldName">Temple</small></h1>
    <div class="mid">
      <div class="row"><span><span id="lvLabel">Level</span><b id="hLevel">1</b></span><span class="stars" id="hStars"></span></div>
      <div class="bar" aria-label="Level progress"><i id="prog"></i></div>
    </div>
    <div class="right"><strong id="hScore">0</strong><small><span id="bestLabel">Best</span> <b id="hBest">0</b></small><span class="hearts"><span id="hLives" aria-label="Lives">♥♥♥</span><span class="cw"><span class="coin"></span><span id="hCoins">0</span></span></span></div>
  </header>
  <div class="pf" id="pf">
    <canvas id="gl" aria-label="Marble shooter board"></canvas>
    <canvas id="hud"></canvas>
    <div id="flash"></div>
  </div>
  <footer class="bot">
    <div class="grp">
      <button class="ic" id="menuBtn" aria-label="Menu">&#9776;</button>
      <button class="ic" id="pauseBtn" aria-label="Pause">&#10074;&#10074;</button>
    </div>
    <button class="ic big" id="swapBtn" aria-label="Swap marble">&#8644;</button>
    <div class="grp">
      <button class="ic" id="bFire" data-b="fire" aria-label="Fireball"><img alt=""><span class="n">0</span></button>
      <button class="ic" id="bZap" data-b="zap" aria-label="Lightning"><img alt=""><span class="n">0</span></button>
      <button class="ic" id="bFreeze" data-b="freeze" aria-label="Freeze"><img alt=""><span class="n">0</span></button>
    </div>
  </footer>
  <div class="overlay" id="ov"><div class="ovin"><p>…</p></div></div>
</div>

<script src="three.min.js"></script>
<script>
(()=>{
const OV=document.getElementById('ov');
if(!window.THREE){OV.innerHTML='<div class="ovin"><p class="err">The 3D engine could not load. Check your connection and reopen the page. / Le moteur 3D n\'a pas pu se charger.</p></div>';return}
const $=id=>document.getElementById(id);
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

// ===================== CONSTANTS =====================
const W=360,H=560,R=13,D=26,TAU=Math.PI*2,U=100,BALLY=R/U,RAIL=R+4.5,CX=180,CZ=280;
const X3=x=>(x-CX)/U,Z3=y=>(y-CZ)/U;
const COLORS=[
  {c:'#d8283f',l:'#ff9aa8',d:'#3f0410'},{c:'#18a85a',l:'#9ff0c0',d:'#042d15'},{c:'#2a74da',l:'#a8ccff',d:'#071d42'},
  {c:'#eab52a',l:'#fff1b8',d:'#4f3602'},{c:'#9a50de',l:'#e2c6ff',d:'#290b48'},{c:'#ef7a1a',l:'#ffd0a0',d:'#4a1e02'}];
const rnd=n=>Math.floor(Math.random()*n),rr=(a,b)=>a+Math.random()*(b-a),pick=a=>a[rnd(a.length)];

// ===================== LEVEL GEOMETRY =====================
// ===== LEVEL GEOMETRY (shared by the game and the test tools) =====
const LW=360,LH=560,LTAU=Math.PI*2;
function resample(raw,step=2){const P=[raw[0]];let acc=0;
  for(let i=1;i<raw.length;i++){let[x0,y0]=raw[i-1];const[x1,y1]=raw[i];let seg=Math.hypot(x1-x0,y1-y0);
    while(acc+seg>=step){const f=(step-acc)/seg;x0+=(x1-x0)*f;y0+=(y1-y0)*f;seg-=step-acc;acc=0;P.push([x0,y0])}acc+=seg}
  const e=raw[raw.length-1],l=P[P.length-1];if(Math.hypot(e[0]-l[0],e[1]-l[1])>.5)P.push(e);return P}
function smoothPath(P,win=3,it=2){for(let k=0;k<it;k++){P=P.map((p,i)=>{if(i<win||i>=P.length-win)return p;let x=0,y=0;for(let j=-win;j<=win;j++){x+=P[i+j][0];y+=P[i+j][1]}return[x/(2*win+1),y/(2*win+1)]})}return P}
function spiral(o){const raw=[],T=o.turns*LTAU,e=o.p||1,f=v=>Math.sign(v)*Math.pow(Math.abs(v),e);
  for(let t=0;t<=1.00001;t+=.0005){const th=o.a0+o.dir*t*T,r=o.r0-(o.r0-o.r1)*t+(o.wave?o.wave*Math.sin(o.wk*th):0);
    raw.push([o.cx+r*f(Math.cos(th)),o.cy+r*f(Math.sin(th))*o.ys])}return raw}
function rpoly(pts,rad){const raw=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const[ax,ay]=pts[i-1],[bx,by]=pts[i],[cx,cy]=pts[i+1];const d1=Math.hypot(bx-ax,by-ay),d2=Math.hypot(cx-bx,cy-by),r=Math.min(rad,d1/2,d2/2);
    const p1=[bx+(ax-bx)/d1*r,by+(ay-by)/d1*r],p2=[bx+(cx-bx)/d2*r,by+(cy-by)/d2*r];raw.push(p1);
    for(let k=1;k<=16;k++){const t=k/16,u=1-t;raw.push([u*u*p1[0]+2*u*t*bx+t*t*p2[0],u*u*p1[1]+2*u*t*by+t*t*p2[1]])}}
  raw.push(pts[pts.length-1]);return raw}
function meander(o){const raw=[],span=LTAU-o.gap,P=(r,a)=>[o.cx+r*Math.cos(a),o.cy+r*Math.sin(a)*o.ys];let dir=o.dir,th=o.ga+dir*o.gap/2;
  for(let i=0;i<o.radii.length;i++){const r=o.radii[i],th1=th+dir*span,n=Math.ceil(span*r/2);
    for(let k=0;k<=n;k++)raw.push(P(r,th+(th1-th)*k/n));
    if(i<o.radii.length-1){const r2=o.radii[i+1],rc=(r+r2)/2,rh=(r-r2)/2;
      for(let k=1;k<24;k++){const u=Math.PI*k/24;raw.push(P(rc+rh*Math.cos(u),th1+dir*rh*Math.sin(u)/rc))}
      th=th1;dir=-dir}}return raw}
// two spirals joined by an outer tangent (C-shape), the shooter sits between them
function twinSpirals(o){const[c1x,c1y]=o.c1,[c2x,c2y]=o.c2,ax=Math.atan2(c2y-c1y,c2x-c1x),T=o.turns*LTAU,d=o.dir;
  let th1=ax+Math.PI/2;if(d*(-Math.sin(th1)*Math.cos(ax)+Math.cos(th1)*Math.sin(ax))<0)th1=ax-Math.PI/2;
  const raw=[];for(let t=0;t<=1.00001;t+=.001){const th=th1-d*T*(1-t),r=o.rIn+(o.rOut-o.rIn)*t;raw.push([c1x+r*Math.cos(th),c1y+r*Math.sin(th)])}
  for(let t=0;t<=1.00001;t+=.001){const th=th1+d*T*t,r=o.rOut-(o.rOut-o.rIn)*t;raw.push([c2x+r*Math.cos(th),c2y+r*Math.sin(th)])}return raw}
function waveRows(P,o){return P.map(([x,y])=>{const row=o.rows.find(r=>Math.abs(r-y)<.6);if(row===undefined)return[x,y];
  const e=Math.min(1,Math.max(0,(Math.min(x-o.x0,o.x1-x)-o.m)/22));return[x,y+o.amp*Math.sin((x-o.x0)/o.per)*e*e*(3-2*e)]})}
function snakeRows(rows,x0,x1,startLeft,endX){const pts=[];let left=startLeft;rows.forEach((y,i)=>{const a=left?x0:x1,b=left?x1:x0;
  if(i===rows.length-1&&endX!==undefined){pts.push([a,y],[endX,y])}else pts.push([a,y],[b,y]);left=!left});return pts}
function snakeCols(cols,y0,y1,startTop,endY){const pts=[];let top=startTop;cols.forEach((x,i)=>{const a=top?y0:y1,b=top?y1:y0;
  if(i===cols.length-1&&endY!==undefined){pts.push([x,a],[x,endY])}else pts.push([x,a],[x,b]);top=!top});return pts}
function mirrorX(pts){return pts.map(([x,y])=>[LW-x,y])}
function finish(raw){return resample(smoothPath(resample(raw,4),2,2),2)}

// theme index per level pair: 0 jungle,1 desert,2 ice,3 lava,4 moon,5 city,6 ocean,7 autumn,8 crystal,9 sky,10 tomb,11 cosmos
const LEVEL_DEFS=[
 {th:0,sc:[180,290],tr:()=>[spiral({cx:180,cy:290,a0:Math.PI,dir:1,turns:2,r0:162,r1:70,ys:1.32})]},
 {th:0,sc:[180,290],tr:()=>[spiral({cx:180,cy:290,a0:-Math.PI/2,dir:1,turns:2,r0:158,r1:72,ys:1.3,wave:10,wk:5})]},
 {th:1,sc:[180,280],tr:()=>[rpoly([[22,50],[332,50],[332,112],[30,112],[30,174],[332,174],[332,386],[30,386],[30,448],[332,448],[332,510],[64,510]],31)]},
 {th:1,sc:[180,290],tr:()=>[twinSpirals({c1:[106,160],c2:[254,420],rIn:24,rOut:92,turns:1.35,dir:1})]},

let slowT=0,revT=0,aimT=0,freezeT=0,x2T=0,coin=null,coinT=10,maxFr=0,texts=[],bolts=[],banner=0,kick=0,shake=0,flashA=0,lostT=0,tt=0;
let critters=[],critT=1,ambP=[],curOv=null;

function mkTrack(P){return{P,L:(P.length-1)*2,balls:[],toSpawn:0,total:0,spawned:0,intro:true}}
function tpos(T,s){const P=T.P;if(s<=0)return P[0];if(s>=T.L)return P[P.length-1];const f=s/2,i=Math.floor(f),u=f-i;return[P[i][0]+(P[i+1][0]-P[i][0])*u,P[i][1]+(P[i+1][1]-P[i][1])*u]}
const touching=(T,i)=>T.balls[i].s-T.balls[i+1].s<=D+.6;
function pushPass(T){const b=T.balls;for(let i=b.length-2;i>=0;i--)if(b[i].s<b[i+1].s+D)b[i].s=b[i+1].s+D}
function colorsOnBoard(){const s=new Set();TR.forEach(T=>T.balls.forEach(b=>s.add(b.c)));return s.size?[...s]:[...Array(nColors).keys()]}
function pickShot(){const p=colorsOnBoard();return p[rnd(p.length)]}
function fixShots(){const p=colorsOnBoard();if(!p.includes(cur))cur=pickShot();if(!p.includes(next))next=pickShot()}
function newColor(){if(Math.random()<LP.same)return lastColor;lastColor=rnd(nColors);return lastColor}
function pickPower(){const opts=POW_KEYS.filter(k=>POW[k].min<=LV&&!(k==='life'&&lives>=5));let tot=0;opts.forEach(k=>tot+=POW[k].w);let x=Math.random()*tot;for(const k of opts){x-=POW[k].w;if(x<=0)return k}return opts[0]}
function mkBall(c,s,p=null){return{c,s,vs:s,lv:s,p,bump:0,q:new THREE.Quaternion().setFromEuler(new THREE.Euler(rr(0,TAU),rr(0,TAU),rr(0,TAU)))}}
function addPts(p){const v=Math.round(p*(x2T>0?2:1));score+=v;lvScore+=v;return v}

// ---------- effects ----------
function burst(x,y,c,n=10,sp=130,up=1){for(let k=0;k<n;k++){const a=Math.random()*TAU,v=(40+Math.random()*sp)/U;spawnP(X3(x),.14,Z3(y),Math.cos(a)*v,rr(.6,2.2)*up,Math.sin(a)*v,rr(.5,1),c)}}
function flash(c,a){flashA=Math.max(flashA,a);$('flash').style.background=c}
function light(x,y,c,i=3){flashLight.color.set(c);flashLight.intensity=Math.max(flashLight.intensity,i);flashLight.position.set(X3(x),.45,Z3(y))}
function bumpAround(T,idx,amt=1){for(let i=idx-3;i<=idx+3;i++)if(T.balls[i])T.balls[i].bump=Math.max(T.balls[i].bump,amt*(1-Math.abs(i-idx)*.22))}
function popFx(x,y,c){burst(x,y,COLORS[c].c,12,150);burst(x,y,COLORS[c].l,5,90,1.6);ring(x,y,4,22,.3,COLORS[c].l)}
function fireFx(x,y){burst(x,y,'#ff7a1a',14,180,1.6);burst(x,y,'#ffd23a',8,120,2);ring(x,y,4,26,.3,'#ff9a3a')}

// ---------- chain logic (any number of tracks) ----------
function check(T,idx){const B=T.balls;if(idx<0||idx>=B.length)return 0;const c=B[idx].c;let l=idx,r=idx;
  while(l>0&&B[l-1].c===c&&touching(T,l-1))l--;while(r<B.length-1&&B[r+1].c===c&&touching(T,r))r++;
  const n=r-l+1;if(n<3)return 0;const mult=combo+1,pts=addPts(n*10*mult+(n>3?(n-3)*20:0));
  let sx=0,sy=0;const pw=[];for(let i=l;i<=r;i++){const b=B[i],[x,y]=tpos(T,b.vs);sx+=x;sy+=y;popFx(x,y,b.c);if(b.p)pw.push({p:b.p,x,y,c:b.c})}
  const cx=sx/n,cy=sy/n;ring(cx,cy,10,60+combo*14,.45,'#ffffff');burst(cx,cy,'#fff8d0',8+combo*4,220,1.8);light(cx,cy,COLORS[c].l,4+combo);flash('#ffffff',Math.min(.22,.05+combo*.05));
  texts.push({x:cx,y:cy,t:combo?`COMBO ×${mult}  +${pts}`:`+${pts}`,life:1.2,pop:1,big:combo>0});
  B.splice(l,n);combo++;shake=Math.min(11,4+combo*2.5);if(B[l-1])B[l-1].bump=.9;if(B[l])B[l].bump=.9;
  sfx(520+combo*120,.2,'triangle',.14,300);sfx(1040+combo*240,.12,'sine',.05);sfxNoise(.25,.18,3000,'highpass');
  pw.forEach(activate);fixShots();return n}
function removeWhere(fn){const out=[];TR.forEach(T=>{T.balls=T.balls.filter(b=>{if(b.s<0)return true;const[x,y]=tpos(T,b.s);if(fn(b,x,y)){out.push([x,y,b]);return false}return true})});return out}
function activate({p,x,y,c}){const P2=POW[p];const near=texts.filter(q=>q.big&&q.life>.8&&Math.abs(q.x-x)<120&&Math.abs(q.y-(y-20))<60).length;texts.push({x,y:y-20-near*24,t:P2[LANG].toUpperCase(),life:1.6,pop:1,big:1});
  ring(x,y,10,170,.6,P2.c);ring(x,y,10,110,.45,'#ffffff');flash(P2.c,.22);burst(x,y,P2.c,30,260,1.8);light(x,y,P2.c,7);sfx(880,.35,'sine',.12,-300);sfx(440,.4,'triangle',.08,400);
  const dm=durMul();if(p==='slow')slowT=7*dm;if(p==='rev')revT=3*dm;if(p==='aim')aimT=10*dm;if(p==='freeze')freezeT=5*dm;if(p==='x2')x2T=12*dm;
  if(p==='life'){lives=Math.min(5,lives+1);sfx(660,.2);setTimeout(()=>sfx(990,.3),120)}
  if(p==='fire'){shotMode={k:'fire',n:3};sfx(200,.5,'sawtooth',.08,300)}
  if(p==='rainbow'){shotMode={k:'rainbow',n:2}}
  if(p==='bomb'){shake=14;const out=removeWhere((b,bx,by)=>Math.hypot(bx-x,by-y)<75*(1+.1*upL('bang')));out.forEach(([bx,by,b])=>{burst(bx,by,COLORS[b.c].c,10,180);addPts(10)});burst(x,y,'#ffcf6a',60,320,2.2);sfxThump(.7,90);sfxNoise(.6,.3,600,'lowpass');fixShots()}
  if(p==='zap'){const out=removeWhere(b=>b.c===c);out.forEach(([bx,by,b],i)=>{if(i<40)bolts.push({x:bx,y:by,life:.45,seed:Math.random()*99});burst(bx,by,'#fff36a',10,160,2);addPts(10)});
    flash('#fff6a0',.35);shake=10;sfx(1800,.4,'sawtooth',.05,-1500);sfxNoise(.5,.35,4000,'highpass');fixShots()}}

function updateTrack(T,dt){
  while(T.toSpawn>0&&(!T.balls.length||T.balls[T.balls.length-1].s>-D)){const s=T.balls.length?T.balls[T.balls.length-1].s-D:0;
    T.balls.push(mkBall(newColor(),s,T.spawned>10&&Math.random()<LP.pow?pickPower():null));T.toSpawn--;T.spawned++}
  const B=T.balls,n=B.length;if(!n)return;const gap=[];for(let i=0;i<n-1;i++)gap[i]=!touching(T,i);
  if(T.intro&&B[0].s>T.L*.22)T.intro=false;
  let k=n-1;while(k>0&&touching(T,k-1))k--;
  const fr=B[0].s/T.L;let sp=T.intro?240:LP.speed*(fr>.8?.65:1)*(slowT>0?.35:1);if(!T.intro){if(freezeT>0)sp=0;if(revT>0)sp=-80}
  for(let i=k;i<n;i++)B[i].s+=sp*dt;
  for(let i=0;i<n-1;i++){if(gap[i]&&B[i].c===B[i+1].c){let j=i;while(j>0&&touching(T,j-1))j--;for(let m=j;m<=i;m++)B[m].s-=320*dt}}
  pushPass(T);
  for(let i=0;i<T.balls.length-1&&i<gap.length;i++){if(gap[i]&&touching(T,i)){bumpAround(T,i,.8);sfx(250,.06,'square',.05);if(!check(T,i+1))check(T,i);break}}
  for(const b of T.balls)b.vs+=(b.s-b.vs)*Math.min(1,dt*16);
  if(T.balls.length)maxFr=Math.max(maxFr,T.balls[0].s/T.L)}

function update(dt){
  const live=state!=='paused';
  if(live){updateLife(dt);updateSparks(dt);updateRings(dt);updateAmb(dt)}
  for(const q of texts){q.y-=26*dt;q.life-=dt;q.pop=Math.max(0,q.pop-dt*4)}texts=texts.filter(q=>q.life>0);
  for(const q of bolts)q.life-=dt;bolts=bolts.filter(q=>q.life>0);
  shake*=Math.pow(.02,dt);kick*=Math.pow(.004,dt);banner=Math.max(0,banner-dt);flashA*=Math.pow(.0005,dt);flashLight.intensity*=Math.pow(.002,dt);
  TR.forEach(T=>T.balls.forEach(b=>b.bump=Math.max(0,b.bump-dt*3.5)));
  if(state==='lost'){TR.forEach(T=>{T.balls.forEach(b=>{b.s+=700*dt;b.vs=b.s});T.balls=T.balls.filter(b=>b.s<T.L)});lostT+=dt;if(TR.every(T=>!T.balls.length)&&lostT>.6)loseLife();return}
  if(state!=='play')return;
  slowT=Math.max(0,slowT-dt);revT=Math.max(0,revT-dt);aimT=Math.max(0,aimT-dt);freezeT=Math.max(0,freezeT-dt);x2T=Math.max(0,x2T-dt);
  TR.forEach(T=>updateTrack(T,dt));
  coinT-=dt;if(!coin&&coinT<=0)spawnCoin();if(coin){coin.t-=dt;if(coin.t<=0){coin=null;coinT=10+Math.random()*8}}
  if(proj)updateProj(dt);
  let fr=0;TR.forEach(T=>{if(T.balls.length)fr=Math.max(fr,T.balls[0].s/T.L)});tempoMul=fr>.75?.82:1;
  if(TR.some(T=>T.balls.length&&T.balls[0].s>=T.L)&&(wal.inv.chance||0)>0){wal.inv.chance--;saveWal();TR.forEach(T=>T.balls.forEach(b=>{b.s-=T.L*.32}));
    texts.push({x:SC.x,y:SC.y-70,t:t('second'),life:2,pop:1,big:1});ring(SC.x,SC.y,20,260,.9,'#ff4a6a');flash('#ff4a6a',.3);shake=10;sfx(330,.4,'triangle',.12,500);sfx(660,.5,'sine',.08,300)}
  if(TR.some(T=>T.balls.length&&T.balls[0].s>=T.L)){state='lost';lostT=0;proj=null;stopMusic();flash('#e0344b',.3);shake=12;sfx(200,.9,'sawtooth',.1,-150)}
  else if(TR.every(T=>!T.balls.length&&T.toSpawn===0))winLevel();
  updHud()}
function updateProj(dt){proj.tr.push([proj.x,proj.y]);if(proj.tr.length>12)proj.tr.shift();proj.x+=proj.vx*dt;proj.y+=proj.vy*dt;
  if(proj.x<-30||proj.x>W+30||proj.y<-30||proj.y>H+30){proj=null;return}
  if(coin&&Math.hypot(coin.x-proj.x,coin.y-proj.y)<18){const v=addPts(250);texts.push({x:coin.x,y:coin.y,t:`${t('coin')} +${v}`,life:1.3,pop:1,big:1});
    burst(coin.x,coin.y,'#ffd66b',34,220,1.8);ring(coin.x,coin.y,6,50,.4,'#ffd66b');flash('#ffd66b',.12);light(coin.x,coin.y,'#ffd66b',5);
    sfx(1200,.12,'square',.06);setTimeout(()=>sfx(1600,.2,'square',.06),90);const cv=earn(20);texts.push({x:coin.x,y:coin.y+18,t:`+${cv}`,life:1.4,pop:1,big:1,coin:1});coin=null;coinT=12+Math.random()*8;if(proj.sp!=='fire'){proj=null;return}}
  if(proj.sp==='fire'){const out=removeWhere((b,x,y)=>Math.hypot(x-proj.x,y-proj.y)<D*.95);
    if(out.length){out.forEach(([x,y,b])=>{fireFx(x,y);addPts(15);if(b.p)activate({p:b.p,x,y,c:b.c})});proj.hits+=out.length;shake=Math.max(shake,4);sfxNoise(.2,.25,900);sfxThump(.3,90);fixShots();
      if(proj.hits>=7+upL('bang')){burst(proj.x,proj.y,'#ff7a1a',40,260,2);ring(proj.x,proj.y,8,70,.5,'#ff9a3a');proj=null}}return}
  for(const T of TR){const B=T.balls;for(let j=0;j<B.length;j++){const b=B[j];if(b.s<0)continue;const[x,y]=tpos(T,b.s);
    if(Math.hypot(x-proj.x,y-proj.y)<D*.95){const f=tpos(T,b.s+D/2),bk=tpos(T,b.s-D/2);let idx,s;
      if(Math.hypot(f[0]-proj.x,f[1]-proj.y)<Math.hypot(bk[0]-proj.x,bk[1]-proj.y)){idx=j;s=b.s+D}else{idx=j+1;s=b.s}
      const c=proj.sp==='rainbow'?b.c:proj.c,nb=mkBall(c,s);nb.q.copy(proj.q);B.splice(idx,0,nb);pushPass(T);
      ring(proj.x,proj.y,6,30,.28,COLORS[c].l);burst(proj.x,proj.y,proj.sp==='rainbow'?'#ffffff':COLORS[c].l,10,120);light(proj.x,proj.y,COLORS[c].l,2.5);bumpAround(T,idx,1);nb.bump=1.2;
      shake=Math.max(shake,2.5);proj=null;combo=0;sfx(420,.05,'square',.06);sfxNoise(.06,.2,2500);check(T,T.balls.indexOf(nb));return}}}}
function spawnCoin(){for(let k=0;k<50;k++){const x=40+Math.random()*(W-80),y=50+Math.random()*(H-100);if(Math.hypot(x-SC.x,y-SC.y)<60)continue;let ok=true;
  for(const T of TR){for(let i=0;i<T.P.length;i+=4)if(Math.hypot(T.P[i][0]-x,T.P[i][1]-y)<34){ok=false;break}if(!ok)break}
  if(ok){coin={x,y,t:8};sfx(1000,.1,'sine',.05);return}}coinT=4}
function winLevel(){state='won';const stars=maxFr<.55?3:maxFr<.8?2:1,bonus=addPts(300+LV*60),won=earn(30+stars*25+LV*6);
  prog.s[LV]=Math.max(prog.s[LV]||0,stars);if(LV<24)prog.u=Math.max(prog.u,LV+1);saveProg();saveBest();updHud();stopMusic();
  for(let i=0;i<6;i++)setTimeout(()=>{const x=rr(60,W-60),y=rr(100,460),c=pick(COLORS).c;ring(x,y,5,80,.6,theme.accent);burst(x,y,c,40,260,2.4);light(x,y,c,5);sfxThump(.3,200)},i*170);
  sfx(660,.15);setTimeout(()=>sfx(880,.15),150);setTimeout(()=>sfx(1320,.3),300);
  setTimeout(()=>showWin(stars,bonus,won),1100)}
function loseLife(){lives--;updHud();if(lives>0){state='retry';showRetry()}else{state='over';saveBest();showOver()}}
function saveBest(){if(score>best){best=score;store('marbleos2-best',String(best))}}

const FLY_SPD={butterfly:34,bird:85,vulture:46,dragonfly:70,bat:95,owl:55,plane:26,comet:150,satellite:22};
const CRAWL_SPD={beetle:16,scarab:14,lizard:30,penguin:14,squirrel:40,crab:18,car:90,fish:32,turtle:12,jelly:8};
function spawnCritter(){const opts=[...theme.fly.map(k=>[1,k]),...theme.crawl.map(k=>[0,k])];if(!opts.length)return;const[fly,k]=pick(opts),o={k,fly,t:0,n:1,col:null};
  const across=()=>{const side=rnd(4),m=50;if(side===0){o.x=-m;o.y=rr(40,520);o.ang=rr(-.5,.5)}else if(side===1){o.x=W+m;o.y=rr(40,520);o.ang=Math.PI+rr(-.5,.5)}
    else if(side===2){o.x=rr(40,320);o.y=-m;o.ang=Math.PI/2+rr(-.5,.5)}else{o.x=rr(40,320);o.y=H+m;o.ang=-Math.PI/2+rr(-.5,.5)}};
  if(fly||['fish','turtle','jelly'].includes(k)){across();o.sp=(FLY_SPD[k]||CRAWL_SPD[k])*rr(.8,1.2);o.wob=rr(.4,1.2);
    if(k==='bird')o.n=1+rnd(3);if(k==='fish')o.n=3+rnd(4);if(k==='bat')o.n=1+rnd(3);
    o.col=k==='butterfly'?pick(['#ffd23a','#7fd1ff','#ff8ad8','#ff9a3a','#ffffff']):k==='bird'?(theme.k==='ice'?'#e8eef4':theme.k==='city'?'#7a7e88':'#3a3026'):k==='fish'?pick(['#ff9a3a','#ffd23a','#5fe0d0','#ff6a8a']):k==='jelly'?pick(['#ff9ad8','#9ad8ff']):null}
  else{const band=rnd(4),dir=Math.random()<.5?1:-1;o.sp=CRAWL_SPD[k]*rr(.8,1.25);o.walk=1;
    if(k==='car'){const top=Math.random()<.5;o.y=top?(dir>0?-14:-30):(dir>0?576:590);o.x=dir>0?FX0-30:FX1+30;o.ang=dir>0?0:Math.PI;o.col=pick(['#c8283a','#2a5cc8','#e6e6ea','#1a1c22','#e8b830','#2aa060','#ff6a1a']);o.kind=pick(['car','car','taxi','bus','police'])}
    else if(band<2){o.y=band?rr(568,592):rr(-34,-10);o.x=dir>0?FX0-10:FX1+10;o.ang=dir>0?0:Math.PI}else{o.x=band===2?rr(-34,-10):rr(370,394);o.y=dir>0?FY0-10:FY1+10;o.ang=dir>0?Math.PI/2:-Math.PI/2}
    o.col=k==='beetle'?pick(['#2a4a2a','#3a2a5a','#1a3a4a']):k==='scarab'?'#3a5a3a':k==='lizard'?pick(['#5a8a3a','#b08a4a']):k==='crab'?'#e0503a':k==='squirrel'?'#b8662a':o.col}
  critters.push(o)}
function updateLife(dt){critT-=dt;if(critT<=0){if(critters.length<(theme.k==='city'?9:6))spawnCritter();critT=theme.k==='city'?rr(.7,1.6):rr(1.8,3.6)}
  for(const o of critters){o.t+=dt;if(!o.walk||o.k==='fish')o.ang+=Math.sin(o.t*(o.wob||1))*dt*.35;else if(o.k!=='car')o.ang+=Math.sin(o.t*2.3)*dt*.25;
    o.x+=Math.cos(o.ang)*o.sp*dt;o.y+=Math.sin(o.ang)*o.sp*dt}
  critters=critters.filter(o=>o.x>FX0-80&&o.x<FX1+80&&o.y>FY0-80&&o.y<FY1+80)}
function E(g,x,y,rx,ry,c,rot=0){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);g.fill()}
function legs6(g,ph,len,col){g.strokeStyle=col;g.lineWidth=.6;for(let i=0;i<3;i++){const x=-2+i*2.2,a=Math.sin(ph+i*2)*.5;[1,-1].forEach(s=>{g.beginPath();g.moveTo(x,0);g.lineTo(x+Math.sin(a*s)*len*.6,s*len);g.stroke()})}}
const CR={

   E(g,0,0,5,1.8,c);E(g,4.6,0,1.6,1.4,c);g.fillStyle='#e8a830';g.beginPath();g.moveTo(6,-.4);g.lineTo(7.6,0);g.lineTo(6,.4);g.fill();g.fillStyle=c;g.beginPath();g.moveTo(-4,0);g.lineTo(-7.5,-2);g.lineTo(-7.5,2);g.fill();g.restore()}},
 vulture(g,o){const f=Math.sin(o.t*2)*.15+1,c='#2a1e14';g.fillStyle=c;g.beginPath();g.moveTo(2,-2);g.lineTo(-2,-17*f);g.lineTo(-6,-18*f);g.lineTo(-5,-2);g.lineTo(-5,2);g.lineTo(-6,18*f);g.lineTo(-2,17*f);g.lineTo(2,2);g.closePath();g.fill();

  else if(k==='sand'){p.x+=50*p.s*dt;p.y+=6*dt}else if(k==='snow'){p.x+=10*dt+Math.sin(p.ph)*6*dt;p.y+=22*p.s*dt}
  else if(k==='embers'){p.x+=Math.sin(p.ph)*10*dt;p.y-=18*p.s*dt}else if(k==='rain'){p.x-=60*dt;p.y+=420*p.s*dt}
  else if(k==='bubbles'){p.x+=Math.sin(p.ph*1.3)*10*dt;p.y-=26*p.s*dt}else if(k==='leaves'||k==='petals'){p.x+=(16+Math.sin(p.ph)*14)*dt;p.y+=20*p.s*dt;p.rot+=dt*(1+p.s)}

function iconPath(g,k){g.lineCap='round';g.lineJoin='round';g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=1.7;
  switch(k){
  case'slow':g.beginPath();g.arc(0,0,5,0,TAU);g.moveTo(0,0);g.lineTo(0,-3.4);g.moveTo(0,0);g.lineTo(2.5,1.2);g.stroke();break;
  case'rev':g.beginPath();g.moveTo(1,-4);g.lineTo(-3,0);g.lineTo(1,4);g.moveTo(5,-4);g.lineTo(1,0);g.lineTo(5,4);g.stroke();break;
  case'bomb':g.beginPath();g.arc(-.6,1,4.2,0,TAU);g.fill();g.beginPath();g.moveTo(2,-2.5);g.quadraticCurveTo(4,-5.5,6,-4.4);g.stroke();g.fillStyle='#ffd23a';g.beginPath();g.arc(6,-4.4,1.3,0,TAU);g.fill();break;
  case'aim':g.beginPath();g.arc(0,0,4,0,TAU);g.moveTo(-6.5,0);g.lineTo(-2,0);g.moveTo(2,0);g.lineTo(6.5,0);g.moveTo(0,-6.5);g.lineTo(0,-2);g.moveTo(0,2);g.lineTo(0,6.5);g.stroke();break;
  case'zap':g.beginPath();g.moveTo(1.8,-6.5);g.lineTo(-3.6,1);g.lineTo(-.2,1);g.lineTo(-1.6,6.5);g.lineTo(3.6,-1);g.lineTo(.2,-1);g.closePath();g.fill();break;
  case'freeze':g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3,c=Math.cos(a),s=Math.sin(a);g.moveTo(0,0);g.lineTo(c*6,s*6);g.moveTo(c*3.6-s*1.6,s*3.6+c*1.6);g.lineTo(c*4.6,s*4.6);g.lineTo(c*3.6+s*1.6,s*3.6-c*1.6)}g.stroke();break;
  case'fire':g.beginPath();g.moveTo(0,6);g.bezierCurveTo(-5.5,5,-5,-1,-1,-6.5);g.bezierCurveTo(-1,-2,2,-2,2.2,-4.5);g.bezierCurveTo(5.5,-1,5.5,5,0,6);g.fill();break;

    _ax.set(proj.vy,0,-proj.vx).normalize();_q.setFromAxisAngle(_ax,dt*Math.hypot(proj.vx,proj.vy)/R);proj.q.premultiply(_q);projMesh.quaternion.copy(proj.q);

    g.fillStyle='#000';g.fillText(q.t,1.5,1.5);g.fillStyle=q.coin?'#ffd66b':q.big?'#ffffff':'#f6dc96';g.fillText(q.t,0,0);
    if(q.coin){const w=g.measureText(q.t).width,cx=w/2+9*s,cy=-5*s,gr=g.createRadialGradient(cx-2,cy-2,1,cx,cy,7*s);gr.addColorStop(0,'#fff3b8');gr.addColorStop(.6,'#e8b838');gr.addColorStop(1,'#8a6410');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,6.5*s,0,TAU);g.fill()}g.restore()}
  const chips=[];if(slowT>0)chips.push(['slow',slowT]);if(revT>0)chips.push(['rev',revT]);if(freezeT>0)chips.push(['freeze',freezeT]);if(aimT>0)chips.push(['aim',aimT]);if(x2T>0)chips.push(['x2',x2T]);

  g.font='800 11px Manrope, system-ui, sans-serif';g.textAlign='left';chips.forEach(([k,tm,n],i)=>{const x=10,y=10+i*26;g.fillStyle='rgba(0,0,0,.62)';if(g.roundRect){g.beginPath();g.roundRect(x,y,92,22,11);g.fill()}else g.fillRect(x,y,92,22);

const priceBtn=(act,k,price,label)=>`<button class="buy" data-act="${act}" data-k="${k}" ${price>wal.coins?'disabled':''}>${label||`<span class="coin"></span>${price}`}</button>`;
const chestIcon=(()=>{const c=mkCanvas(52,52),g=c.getContext('2d');g.fillStyle='#6a3a14';g.fillRect(8,20,36,24);g.fillStyle='#8a4e1c';g.beginPath();g.moveTo(8,22);g.quadraticCurveTo(26,4,44,22);g.closePath();g.fill();
  g.fillStyle='#d4ad62';g.fillRect(8,20,36,4);g.fillRect(23,18,6,26);g.fillRect(8,40,36,4);g.fillStyle='#fff3b8';g.fillRect(24,28,4,6);return c.toDataURL()})();
const giftIcon=(()=>{const c=mkCanvas(52,52),g=c.getContext('2d');g.fillStyle='#b01e34';g.fillRect(9,20,34,26);g.fillStyle='#d8283f';g.fillRect(6,14,40,9);g.fillStyle='#e8b838';g.fillRect(23,14,6,32);
  g.strokeStyle='#e8b838';g.lineWidth=4;g.beginPath();g.ellipse(19,10,7,5,-.4,0,TAU);g.ellipse(33,10,7,5,.4,0,TAU);g.stroke();return c.toDataURL()})();
function showShop(tab){if(tab)shopTab=tab;if(state==='play'){state='paused';if(ac)ac.suspend();$('pauseBtn').innerHTML='&#9654;'}
  const tabs=[['boost',t('tBoost')],['up',t('tUp')],['gift',t('tGift')]].map(([k,l])=>`<button data-act="tab" data-t="${k}" aria-pressed="${shopTab===k}">${l}</button>`).join('');
  let html='';
  if(shopTab==='boost')html=Object.keys(BOOST).map(k=>{const B=BOOST[k];return shopItem(ICONS[B.icon],B[LANG],B['d'+LANG]+(k==='chance'?` · ${t('auto')}`:''),`${t('owned')} ${wal.inv[k]||0}`,null,priceBtn('buyB',k,B.price))}).join('');
  if(shopTab==='up')html=Object.keys(UPS).map(k=>{const u=UPS[k],l=upL(k),max=l>=u.max;return shopItem(ICONS[u.icon],u[LANG],u['d'+LANG],null,[l,u.max],max?`<span class="buy tag">${t('maxed')}</span>`:priceBtn('buyU',k,upPrice(k)))}).join('');
  if(shopTab==='gift'){const dd=wal.daily===today();
    html=shopItem(giftIcon,t('daily'),dd?t('dailyDone'):t('dailyD'),null,null,dd?`<span class="buy tag">✓</span>`:`<button class="buy gift" data-act="daily">${t('free')}</button>`)
     +shopItem(chestIcon,t('chest'),t('chestD'),null,null,priceBtn('chest','x',400))
     +`<h3>${t('skins')}</h3>`+Object.keys(SKINS).map(k=>{const S2=SKINS[k],own=wal.skins.includes(k),on=wal.skin===k;
       return shopItem(S2.c,S2[LANG],t('skinD'),null,null,on?`<span class="buy tag">${t('equipped')}</span>`:own?`<button class="buy" data-act="skin" data-k="${k}">${t('equip')}</button>`:priceBtn('skin',k,S2.price))}).join('')}
  ovShow(showShop,`<h2>${t('shop')}</h2><p class="wallet"><span class="coin"></span>${wal.coins}</p><div class="langs" role="group">${tabs}</div><div class="shop">${html}</div>
   ${wal.coins<100?`<p class="tip">${t('needMore')}</p>`:''}<button class="btn" data-act="back">${t('back')}</button>`,
   {tab:b=>showShop(b.dataset.t),back:()=>{(shopBack||showHome)()},
    buyB:b=>{const k=b.dataset.k,pr=BOOST[k].price;if(wal.coins<pr)return;wal.coins-=pr;wal.inv[k]=(wal.inv[k]||0)+1;saveWal();buySfx();updHud();showShop()},
    buyU:b=>{const k=b.dataset.k,pr=upPrice(k);if(wal.coins<pr||upL(k)>=UPS[k].max)return;wal.coins-=pr;wal.up[k]=upL(k)+1;saveWal();buySfx();updHud();showShop()},
    skin:b=>{const k=b.dataset.k;if(!wal.skins.includes(k)){if(wal.coins<SKINS[k].price)return;wal.coins-=SKINS[k].price;wal.skins.push(k);buySfx()}wal.skin=k;saveWal();applySkin();updHud();showShop()},
    chest:()=>{if(wal.coins<400)return;wal.coins-=400;const got=[],n=2+(Math.random()<.4?1:0);for(let i=0;i<n;i++){const k=Math.random()<.12?'chance':pick(['fire','zap','freeze']);wal.inv[k]=(wal.inv[k]||0)+1;got.push(k)}
      const bonus=Math.random()<.6?Math.round(rr(60,220)/10)*10:0;wal.coins+=bonus;saveWal();buySfx();updHud();showGot(got,bonus,showShop)},
    daily:claimDaily})}
function claimDaily(){if(wal.daily===today())return;wal.daily=today();const k=pick(['fire','zap','freeze','fire','zap','freeze','chance']),bonus=Math.round(rr(60,180)/10)*10;
  wal.inv[k]=(wal.inv[k]||0)+1;wal.coins+=bonus;saveWal();buySfx();updHud();showGot([k],bonus,curOv===showShop?showShop:showHome)}
function showGot(list,bonus,back){const items=list.map(k=>`<div><img src="${ICONS[BOOST[k].icon]}" alt="">${BOOST[k][LANG]}</div>`).join('');
  ovShow(()=>showGot(list,bonus,back),`<h2>${t('great')}<span>${t('got')}</span></h2><div class="gotlist">${items}</div>${bonus?`<p class="wallet"><span class="coin"></span>+${bonus} ${t('coins')}</p>`:''}<button class="play" data-act="ok">OK</button>`,{ok:()=>back()});
  for(let i=0;i<5;i++)setTimeout(()=>sfx(660+i*110,.15,'triangle',.08),i*90)}
function buySfx(){sfx(880,.1,'triangle',.1);setTimeout(()=>sfx(1320,.18,'triangle',.08),90)}
function applySkin(){const S2=SKINS[wal.skin]||SKINS.gold;goldMat.color.set(S2.c);goldMat.metalness=S2.m;goldMat.roughness=S2.r;const ec=S2.eye||theme.accent;eyeMat.color.set(ec);eyeMat.emissive.set(ec)}
const BTN={fire:$('bFire'),zap:$('bZap'),freeze:$('bFreeze')};
Object.entries(BTN).forEach(([k,el])=>{el.querySelector('img').src=ICONS[BOOST[k].icon];el.onclick=()=>useBoost(k)});
function updBoost(){Object.entries(BTN).forEach(([k,el])=>{const n=wal.inv[k]||0;el.querySelector('.n').textContent=n;el.classList.toggle('empty',!n)})}
function useBoost(k){initAudio();if(state!=='play'){if(state==='menu')openShop('boost');return}
  if(!(wal.inv[k]>0)){openShop('boost');return}
  if(k==='fire'&&shotMode&&shotMode.k==='fire')return;
  let c=cur;if(k==='zap'){const cols=colorsOnBoard();if(!cols.includes(c))c=cols[0]}
  wal.inv[k]--;saveWal();activate({p:k,x:SC.x,y:SC.y-60,c});updHud()}

// ===================== CAMERA + RESIZE =====================
const TILT=.16;
function fitCamera(){const w=pf.clientWidth,h=pf.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();
  const dir=new THREE.Vector3(0,Math.cos(TILT),Math.sin(TILT));let tz=0,dist=10;const C=[[-5,-5],[365,-5],[-5,565],[365,565]];
  for(let it=0;it<80;it++){camTarget.set(0,0,tz);camera.position.copy(camTarget).addScaledVector(dir,dist);camera.lookAt(camTarget);camera.updateMatrixWorld();
    let x0=9,x1=-9,y0=9,y1=-9;C.forEach(([x,y])=>{_v.set(X3(x),0,Z3(y)).project(camera);x0=Math.min(x0,_v.x);x1=Math.max(x1,_v.x);y0=Math.min(y0,_v.y);y1=Math.max(y1,_v.y)});
    const need=Math.max((x1-x0)/1.98,(y1-y0)/1.98);dist*=Math.pow(need,.8);tz-=((y1+y0)/2)*dist*.2}
  camBase.copy(camera.position)}
function resize(){const w=pf.clientWidth,h=pf.clientHeight;if(!w||!h)return;const dpr=Math.min(2,window.devicePixelRatio||1);
  renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);hdpr=dpr;hw=w;hh=h;hud.width=Math.round(w*dpr);hud.height=Math.round(h*dpr);fitCamera()}

// ===================== LOOP + INPUT =====================
let last=performance.now();
function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(state!=='paused')tt+=dt;update(dt);
  if(state!=='paused'&&(++flTick%2===0))drawFL();sync(dt);renderer.render(scene,camera);drawHud();requestAnimationFrame(loop)}
const ray=new THREE.Raycaster(),boardPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-BALLY),_ndc=new THREE.Vector2(),_hit=new THREE.Vector3();
function toBoard(e){const r=glc.getBoundingClientRect();_ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(_ndc,camera);
  if(!ray.ray.intersectPlane(boardPlane,_hit))return null;return[_hit.x*U+CX,_hit.z*U+CZ]}
function swap(){if(state!=='play')return;[cur,next]=[next,cur];kick=.4;ring(SC.x,SC.y,20,44,.25,theme.accent);sfx(700,.05,'sine',.06)}
glc.addEventListener('pointermove',e=>{if(state!=='play')return;const p=toBoard(e);if(p)aim=Math.atan2(p[1]-SC.y,p[0]-SC.x)});
glc.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play')return;initAudio();const p=toBoard(e);if(!p)return;const[x,y]=p;
  if(Math.hypot(x-SC.x,y-SC.y)<36){swap();return}
  aim=Math.atan2(y-SC.y,x-SC.x);if(proj)return;const v=(aimT>0?1100:680)*(1+.08*upL('speed')),cx=Math.cos(aim),cy=Math.sin(aim),sp=shotMode?shotMode.k:null;
  proj={x:SC.x+cx*24,y:SC.y+cy*24,vx:cx*v,vy:cy*v,c:cur,sp,hits:0,tr:[],q:new THREE.Quaternion()};
  const mx=SC.x+cx*40,my=SC.y+cy*40,C=sp==='fire'?{c:'#ff7a1a',l:'#ffd080'}:COLORS[cur];kick=1;shake=Math.max(shake,3);
  ring(mx,my,4,28,.25,C.l);ring(mx,my,2,16,.15,'#ffffff');light(mx,my,C.l,4);
  for(let i=0;i<22;i++){const a=aim+(Math.random()-.5)*1.1,s2=rr(1.4,3.6);spawnP(X3(mx),BALLY+.05,Z3(my),Math.cos(a)*s2,rr(.3,1.6),Math.sin(a)*s2,rr(.2,.45),i%3?C.c:theme.accent,-3)}
  if(shotMode){shotMode.n--;if(shotMode.n<=0)shotMode=null}else{cur=next;next=pickShot()}
  sfxThump(.4,160);sfx(sp==='fire'?120:180,.1,sp==='fire'?'sawtooth':'triangle',.08,260);sfxNoise(.12,.22,1400)});
$('swapBtn').onclick=()=>{initAudio();swap()};
$('pauseBtn').onclick=()=>{initAudio();if(state==='play'){state='paused';if(ac)ac.suspend();$('pauseBtn').innerHTML='&#9654;'}else if(state==='paused'&&OV.hidden)resumeGame()};
$('menuBtn').onclick=()=>{initAudio();if(state==='play'||state==='paused')showPause();else if(OV.hidden||curOv!==showHome)showHome()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&state==='play'){e.preventDefault();swap()}if(e.code==='Digit1')useBoost('fire');if(e.code==='Digit2')useBoost('zap');if(e.code==='Digit3')useBoost('freeze');if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')showPause();else if(state==='paused')resumeGame()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')showPause()});

window.__mosPause=()=>{if(state==='play')showPause()};
window.__mosBack=()=>{if(state==='play'){showPause();return'ok'}if(state==='paused'&&curOv===showPause){resumeGame();return'ok'}if(curOv===showHome)return'exit';if(curOv===showShop&&shopBack){shopBack();return'ok'}showHome();return'ok'};
window.__mos={tick:dt=>{update(dt);sync(dt)},snap:()=>({cur,proj:!!proj,sc:[SC.x,SC.y],balls:TR.flatMap(T=>T.balls.filter(b=>b.s>30&&b.s<T.L-20).map(b=>({c:b.c,p:tpos(T,b.s)})))}),aimFire:(x,y)=>{aim=Math.atan2(y-SC.y,x-SC.x);window.__mos.fire(x,y)},get state(){return state},start:n=>{newSession();startLevel(n)},info:()=>({LV,state,score,lives,tracks:TR.map(T=>T.balls.length+'/'+T.toSpawn),theme:theme.k,crit:critters.length}),
  fire:(x,y)=>{const r=glc.getBoundingClientRect();_v.set(X3(x),BALLY,Z3(y)).project(camera);glc.dispatchEvent(new PointerEvent('pointerdown',{clientX:r.left+(_v.x+1)/2*r.width,clientY:r.top+(1-_v.y)/2*r.height,bubbles:true}))},
  levels:showLevels,home:showHome,setLang,activate:(p)=>{const T=TR[0];const b=T.balls.find(q=>q.s>0);if(b){const[x,y]=tpos(T,b.s);activate({p,x,y,c:b.c})}},trackBalls:()=>TR.map(T=>T.balls.filter(b=>b.s>20).slice(0,3).map(b=>tpos(T,b.s)))};
new ResizeObserver(resize).observe(pf);resize();updTexts();showHome();requestAnimationFrame(loop);
})();
</script>
